[pytest]
python_files = tests/*.py
DJANGO_SETTINGS_MODULE = main.settings
addopts =
#  --cov
#  --reuse-db
#  --nomigrations
filterwarnings =
  ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning
  ignore::RuntimeWarning
env =
  DEBUG=true
  DJANGO_SECRET_KEY='123'
  DATABASE_URL=sqlite://:memory:
  DJANGO_ALLOWED_HOSTS='*'
  REDIS_URL=redis://redis_test:6379/10
  DEFAULT_GROUP_NAME='direct'
  DOMAINS_REDIS_KEY="routes:domains"
  CIDRS_REDIS_KEY="routes:cidr"
  DEFAULT_ROUTE_REDIS_KEY="routes:default"
